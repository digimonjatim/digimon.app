<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07192F">
<title>Lupa Password — DIGIMON</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--brand:#2C3979;--brand-d:#212c5e;--bg:#f9fafb;--card:#fff;--ink:#101828;--mut:#667085;--line:#d0d5dd;--ok:#12b76a;--err:#d92d20}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Outfit",system-ui,sans-serif}
  .card{width:100%;max-width:440px;background:var(--card);border:1px solid #e4e7ec;border-radius:16px;padding:28px;box-shadow:0 12px 16px -4px rgba(16,24,40,.08)}
  h1{margin:0 0 4px;font-size:22px;color:var(--brand)} .sub{margin:0 0 20px;color:var(--mut);font-size:14px}
  label{display:block;margin:14px 0 6px;font-size:13px;font-weight:500}
  input{width:100%;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
  input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px rgba(44,57,121,.12)}
  .pw{position:relative} .pw input{padding-right:64px}
  .eye{position:absolute;right:6px;top:6px;height:32px;padding:0 10px;border:0;background:none;color:var(--brand);font:600 12px "Outfit",sans-serif;cursor:pointer}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;height:46px;margin-top:20px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:600 15px "Outfit",sans-serif;cursor:pointer;text-decoration:none}
  .btn:hover{background:var(--brand-d)} .btn:disabled{opacity:.6;cursor:wait}
  .link{display:block;margin-top:14px;text-align:center;background:none;border:0;color:var(--brand);font:600 13px "Outfit",sans-serif;cursor:pointer;text-decoration:none}
  .link:disabled{color:var(--mut);cursor:default}
  .hide{display:none!important} .msg{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:13px;background:#fef3f2;color:var(--err)}
  .msg.ok{background:#ecfdf3;color:#027a48}
  .otp{letter-spacing:.5em;text-align:center;font-size:22px;font-weight:600}
  .center{text-align:center} .big{font-size:44px;margin:6px 0}
  .foot{margin-top:18px;text-align:center;font-size:13px;color:var(--mut)} .foot a{color:var(--brand);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main class="card">
  <h1>Lupa Password</h1>

  <!-- STEP 1: Email / NIK -->
  <section id="p1">
    <p class="sub">Masukkan Email atau NIK akunmu. Kode OTP akan dikirim ke Telegram yang terhubung dengan akun.</p>
    <label for="ident">Email / NIK Employee</label>
    <input id="ident" autocomplete="username" spellcheck="false" placeholder="Masukkan email atau NIK">
    <div id="e1" class="msg hide"></div>
    <button class="btn" id="b1">Kirim OTP ke Telegram</button>
    <div class="foot"><a href="login.html">← Kembali ke login</a></div>
  </section>

  <!-- STEP 2: OTP + password baru -->
  <section id="p2" class="hide">
    <p class="sub">Jika akun ditemukan dan aktif, kode OTP 6 digit sudah dikirim ke Telegram kamu (berlaku 10 menit).</p>
    <label for="otp">Kode OTP</label>
    <input id="otp" class="otp" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
    <label for="pw1">Password Baru</label>
    <div class="pw"><input id="pw1" type="password" autocomplete="new-password" placeholder="Minimal 8 karakter"><button type="button" class="eye" data-t="pw1">Lihat</button></div>
    <label for="pw2">Konfirmasi Password Baru</label>
    <div class="pw"><input id="pw2" type="password" autocomplete="new-password" placeholder="Ulangi password baru"><button type="button" class="eye" data-t="pw2">Lihat</button></div>
    <div id="e2" class="msg hide"></div>
    <button class="btn" id="b2">Reset Password</button>
    <button class="link" id="resend" type="button" disabled>Kirim ulang OTP</button>
    <div class="foot"><a href="login.html">← Kembali ke login</a></div>
  </section>

  <!-- STEP 3: selesai -->
  <section id="p3" class="hide center">
    <div class="big">✅</div>
    <p class="sub" id="doneTxt">Password berhasil diubah.</p>
    <a class="btn" href="login.html">Masuk ke Dashboard</a>
  </section>
</main>

<script>
// Sesuaikan slug di akhir URL dengan Endpoint URL fungsi "auth" di dashboard Supabase.
const AUTH_URL = 'https://lhnwbupbqnewhlzdobcr.supabase.co/functions/v1/auth';
const $ = id => document.getElementById(id);
let resetId = null, ident = '', cdTimer = null;

async function api(action, body) {
  try {
    const r = await fetch(AUTH_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ action }, body)) });
    return (await r.json().catch(() => null)) || { success: false, message: 'Respons server tidak valid.' };
  } catch (e) { return { success: false, message: 'Koneksi gagal. Coba lagi.' }; }
}
const show = (el, t) => { el.textContent = t; el.classList.remove('hide'); };
function step(n) { [1, 2, 3].forEach(i => $('p' + i).classList.toggle('hide', i !== n)); }

function cooldown(sec) {
  clearInterval(cdTimer); const b = $('resend'); b.disabled = true;
  const tick = () => { b.textContent = sec > 0 ? 'Kirim ulang OTP (' + sec + ' dtk)' : 'Kirim ulang OTP'; if (sec <= 0) { b.disabled = false; clearInterval(cdTimer); } sec--; };
  tick(); cdTimer = setInterval(tick, 1000);
}

async function sendOtp(btn, errEl, label) {
  btn.disabled = true; const old = btn.textContent; btn.textContent = 'Memproses…';
  const r = await api('forgot_start', { identifier: ident });
  btn.textContent = old; if (label !== 'resend') btn.disabled = false;
  if (!r.success) { show(errEl, r.message || 'Gagal mengirim OTP.'); return false; }
  resetId = r.resetId; cooldown(60); return true;
}

$('b1').onclick = async () => {
  const e = $('e1'); e.classList.add('hide');
  ident = $('ident').value.trim();
  if (ident.length < 3) return show(e, 'Isi Email atau NIK.');
  if (await sendOtp($('b1'), e)) { step(2); $('otp').focus(); }
};
$('ident').addEventListener('keydown', ev => { if (ev.key === 'Enter') $('b1').click(); });

$('resend').onclick = async () => {
  const e = $('e2'); e.classList.add('hide');
  if (await sendOtp($('resend'), e, 'resend')) { $('otp').value = ''; $('otp').focus(); }
};

$('otp').oninput = e => e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
document.querySelectorAll('.eye').forEach(b => b.onclick = () => {
  const i = $(b.dataset.t); const hidden = i.type === 'password';
  i.type = hidden ? 'text' : 'password'; b.textContent = hidden ? 'Sembunyi' : 'Lihat';
});

$('b2').onclick = async () => {
  const e = $('e2'); e.classList.add('hide');
  const otp = $('otp').value, p1 = $('pw1').value, p2 = $('pw2').value;
  if (otp.length !== 6) return show(e, 'Masukkan 6 digit OTP.');
  if (p1.length < 8) return show(e, 'Password baru minimal 8 karakter.');
  if (p1 !== p2) return show(e, 'Konfirmasi password tidak sama.');
  $('b2').disabled = true; $('b2').textContent = 'Memproses…';
  const r = await api('forgot_verify', { resetId, otp, newPassword: p1 });
  $('b2').disabled = false; $('b2').textContent = 'Reset Password';
  if (!r.success) return show(e, r.message || 'Gagal mereset password.');
  $('pw1').value = ''; $('pw2').value = ''; $('otp').value = '';
  $('doneTxt').textContent = r.message || 'Password berhasil diubah.';
  step(3);
};
</script>
</body>
</html>
